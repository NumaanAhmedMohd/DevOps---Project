version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7-jammy
    container_name: jirahub_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: jirahub
    networks:
      - jira_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jirahub_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/jirahub
      JWT_SECRET: super_secret_jwt_key_change_in_production
      JWT_EXPIRE: 7d
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - jira_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jirahub_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jira_network

volumes:
  mongo_data:
    driver: local

networks:
  jira_network:
    driver: bridge
