<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="JiraSRU — Sign in or create an account to manage your projects and issues." />
  <title>JiraSRU — Sign In</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="auth-page">
  <div class="auth-container">

    <!-- Logo -->
    <div class="auth-logo">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="10" fill="url(#grad)"/>
        <path d="M10 18L18 10L26 18L18 26L10 18Z" fill="white" opacity="0.9"/>
        <path d="M14 18L18 14L22 18L18 22L14 18Z" fill="rgba(0,0,0,0.3)"/>
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="36" y2="36">
            <stop offset="0%" stop-color="#4f8ef7"/>
            <stop offset="100%" stop-color="#a371f7"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="auth-logo-text">JiraSRU</span>
    </div>

    <div class="auth-card">
      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login">Sign In</button>
        <button class="auth-tab" id="tab-register">Create Account</button>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="login-form">
        <div class="alert alert-error" id="login-error"></div>

        <div class="form-group">
          <label class="form-label" for="login-email">Email address</label>
          <input class="form-input" type="email" id="login-email" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input class="form-input" type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button class="btn btn-primary btn-full" type="submit" id="login-btn">Sign In</button>
      </form>

      <!-- Register Form -->
      <form class="auth-form hidden" id="register-form">
        <div class="alert alert-error" id="register-error"></div>

        <div class="form-group">
          <label class="form-label" for="register-name">Full name</label>
          <input class="form-input" type="text" id="register-name" placeholder="John Doe" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="register-email">Email address</label>
          <input class="form-input" type="email" id="register-email" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="register-password">Password <span class="text-muted">(min 6 chars)</span></label>
          <input class="form-input" type="password" id="register-password" placeholder="••••••••" required minlength="6" autocomplete="new-password" />
        </div>

        <button class="btn btn-primary btn-full" type="submit" id="register-btn">Create Account</button>
      </form>
    </div>

    <p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:16px;">
      Built with Node.js · Express · MongoDB · Docker · Kubernetes
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
